# Actions are pinned to commit SHAs, so nothing moves under this lane on its
# own. Dependabot is what then keeps them from going stale.
#
# It cannot see the vega-agent pin: that is a `ref:` inside a checkout step, not
# a `uses:`. agent-pin.yml watches that one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
